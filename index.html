<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>THIN ICE</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #05090c;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
      }
      #wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: crosshair;
        touch-action: none;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8fb2c6;
        letter-spacing: 0.3em;
        font-size: 14px;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #boot.hide { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="480" height="270"></canvas>
      <div id="boot">DRILLING THROUGH THE ICE…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
